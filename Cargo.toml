[workspace]
resolver = "3"
members = [
    "crates/fusion-proto",
    "crates/fusion-network",
    "crates/fusion-discovery",
    "crates/fusion-resources",
    "crates/fusion-scheduler",
    "crates/fusion-master",
    "crates/fusion-worker",
    "crates/fusion-cli",
]
default-members = [
    "crates/fusion-proto",
    "crates/fusion-network",
    "crates/fusion-discovery",
    "crates/fusion-resources",
    "crates/fusion-scheduler",
    "crates/fusion-master",
    "crates/fusion-worker",
    "crates/fusion-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
prost = "0.13"
prost-build = "0.13"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
time = "0.3"
if-addrs = "0.13"
tonic = { version = "0.12", features = ["transport", "tls"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
uuid = { version = "1.12", features = ["v4"] }
x509-parser = { version = "0.16", features = ["verify"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
